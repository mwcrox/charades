<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Charades</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>


    <div id="app">
        <!-- CATEGORY SCREEN -->
        <section id="screen-categories" class="screen">
            <header class="topbar">
                <h1 class="title">Pick a category</h1>
            </header>

            <div class="panel">
                <div id="category-list" class="category-list" aria-live="polite"></div>
            </div>
        </section>

        <!-- COUNTDOWN SCREEN -->
        <section id="screen-countdown" class="screen">
            <div class="center">
                <div class="countdown-label">Get Ready</div>
                <div id="countdown-number" class="countdown-number">5</div>
            </div>
        </section>

        <!-- GAMEPLAY SCREEN -->
        <section id="screen-game" class="screen">
            <header class="topbar compact-topbar">
                <div class="timer-pill">
                    <span class="timer-label">Time</span>
                    <span id="timer" class="timer">60</span>
                </div>
                <div id="category-name" class="category-pill">Category</div>
            </header>

            <main class="game-layout">
                <div class="word-area">
                    <div id="word" class="word">WORD</div>
                </div>

                <div class="answer-buttons" aria-label="Answer controls">
                    <button id="btn-pass" class="answer-btn pass-btn" type="button">Pass</button>
                    <button id="btn-correct" class="answer-btn correct-btn" type="button">Correct</button>
                </div>
            </main>

            <div id="status-overlay" class="status-overlay" aria-hidden="true">
                <div id="status-text" class="status-text">Correct!</div>
            </div>
        </section>

        <!-- RESULTS SCREEN -->
        <section id="screen-results" class="screen">
            <header class="topbar">
                <h2 class="title">Results</h2>
                <div class="score-pill">Score: <span id="score">0</span></div>
            </header>

            <div class="panel">
                <div class="results-list-wrap">
                    <ul id="results-list" class="results-list"></ul>
                </div>

                <button id="btn-back" class="btn btn-primary">Pick New Category</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
