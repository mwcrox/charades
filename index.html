<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tilt Charades</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- MOTION PERMISSION MODAL (shows first) -->
    <div id="motion-modal" class="modal active" role="dialog" aria-modal="true">
        <div class="modal-card">
            <h1 class="modal-title">Tilt Charades</h1>
            <p class="modal-text">
                This game needs access to motion sensors and audio.
                <br><b>Tap Enable</b>, then rotate to <b>landscape</b>.
            </p>
            <button id="modal-enable" class="btn btn-primary">Enable & Start</button>
            <p class="modal-footnote">If you deny permission, tilt controls won’t work.</p>
        </div>
    </div>

    <!-- ROTATE OVERLAY (shows if portrait) -->
    <div id="rotate-overlay" class="rotate-overlay" aria-hidden="true">
        <div class="rotate-card">
            <div class="rotate-icon">🔄</div>
            <div class="rotate-text">Rotate to Landscape</div>
            <div class="rotate-sub">This game only works sideways.</div>
        </div>
    </div>

    <div id="app">
        <!-- CATEGORY SCREEN -->
        <section id="screen-categories" class="screen">
            <header class="topbar">
                <h1 class="title">Pick a category</h1>
            </header>

            <div class="panel">
                <div id="category-list" class="category-list" aria-live="polite"></div>
            </div>
        </section>

        <!-- COUNTDOWN SCREEN -->
        <section id="screen-countdown" class="screen">
            <div class="center">
                <div class="countdown-label">Get Ready</div>
                <div id="countdown-number" class="countdown-number">5</div>
            </div>
        </section>

        <!-- GAMEPLAY SCREEN -->
        <section id="screen-game" class="screen">
            <header class="topbar">
                <div class="timer-pill">
                    <span class="timer-label">Time</span>
                    <span id="timer" class="timer">60</span>
                </div>
                <div id="category-name" class="category-pill">Category</div>
            </header>

            <div class="word-area">
                <div id="word" class="word">WORD</div>
            </div>

            <div id="status-overlay" class="status-overlay" aria-hidden="true">
                <div id="status-text" class="status-text">Correct!</div>
            </div>
        </section>

        <!-- RESULTS SCREEN -->
        <section id="screen-results" class="screen">
            <header class="topbar">
                <h2 class="title">Results</h2>
                <div class="score-pill">Score: <span id="score">0</span></div>
            </header>

            <div class="panel">
                <div class="results-list-wrap">
                    <ul id="results-list" class="results-list"></ul>
                </div>

                <button id="btn-back" class="btn btn-primary">Pick New Category</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
